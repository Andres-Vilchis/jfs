[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.intl",
  "php82Extensions.mbstring",
  "php82Extensions.zip",
  "php82Extensions.pdo_mysql",
  "composer"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader"
]

[start]
cmd = "php spark serve --host 0.0.0.0 --port $PORT"
